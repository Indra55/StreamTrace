services:
  test-db:
    build:
      context: .
      dockerfile: db/Dockerfile.test
    environment:
      POSTGRES_DB: streamtrace_test
      POSTGRES_USER: test_owner
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD for the disposable test database}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_owner -d streamtrace_test"]
      interval: 2s
      timeout: 3s
      retries: 30
